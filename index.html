  file.text().then(async t => {
    let d; try{ d = JSON.parse(t); if(!d.events) throw 0; }catch(e){ return toast('Ungültige Datei'); }
    if(!can('manage_users')) return toast('Nur Admins können importieren');
    if(!await ask('Daten übernehmen? Personen werden über den Namen zugeordnet, unbekannte dir.', 'Importieren')) return;
    const map = {}; (d.users||[]).forEach(u => { map[u.id] = db.users.find(x => x.name.trim().toLowerCase() === String(u.name).trim().toLowerCase())?.id || db.currentUser; });
    const m = id => id ? (map[id] || id) : id;
    (d.events||[]).forEach(e => { e.organizerId = m(e.organizerId); (e.participants||[]).forEach(p => p.userId = m(p.userId)); delete e.approval; });
    (d.todos||[]).forEach(x => x.assignee = m(x.assignee));
    (d.projects||[]).forEach(x => { x.owner = m(x.owner); (x.subtasks||[]).forEach(s => s.assignee = m(s.assignee)); });
    (d.shopping||[]).forEach(x => { x.by = m(x.by); x.doneBy = m(x.doneBy); });
    for(const c of ['events','todos','projects','shopping']) (d[c]||[]).forEach(it => { if(!it.id) it.id = newId(); const i = db[c].findIndex(x => x.id === it.id); if(i >= 0) db[c][i] = it; else db[c].push(it); });
    log('hat Daten importiert'); save(); render(); toast('Import erfolgreich');
  });
  ev.target.value = '';
});

/* ===================== Dialoge & Toast ===================== */
let dlgRes = null;
function dialog(title, fields=[], okLabel='OK', danger=false){
  return new Promise(res => {
    if(dlgRes) dlgRes(null);
    dlgRes = res;
    $('#dlg').innerHTML = `<div class="grab"></div><div class="sh-body"><h2 style="margin:0;font-size:19px">${esc(title)}</h2>${fields.map((f,i) => `<div style="display:flex;flex-direction:column;gap:6px">${f.label?`<label class="lbl" for="dlgF${i}">${esc(f.label)}</label>`:''}<input class="in w100" id="dlgF${i}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" ${f.num?'inputmode="numeric" maxlength="4"':'maxlength="200"'} autocomplete="off"></div>`).join('')}</div>`+
      `<div class="sh-foot"><button class="btn ghost" data-act="dlgNo">Abbrechen</button><button class="btn ${danger?'danger':'primary'}" data-act="dlgYes">${esc(okLabel)}</button></div>`;
    $('#dlgBg').classList.add('show');
    setTimeout(() => (fields.length ? $('#dlgF0') : $('#dlg [data-act=dlgYes]'))?.focus(), 60);
  });
}
function dlgDone(v){ $('#dlgBg').classList.remove('show'); const r = dlgRes; dlgRes = null; if(r) r(v); }
const ask = (t, ok='OK', danger=false) => dialog(t, [], ok, danger).then(v => !!v);
const askText = (t, label, value='', ph='', type='text') => dialog(t, [{label, value, ph, type}]).then(v => v ? v[0] : null);
function toast(msg, action){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action.label)}</button>` : '');
  if(action) t.querySelector('button').onclick = () => { t.classList.remove('show'); action.fn(); };
  t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), action ? 5500 : 2600);
}

/* ===================== Aktionen ===================== */
const ACT = {
  go: a => { page = a.dataset.page; closeSheet(); render(); window.scrollTo(0,0); },
  fab: () => ({cal:() => openNew({date:view==='day' ? iso(cursor) : undefined}), week:() => $('#tdIn')?.focus(), proj:() => openProjNew('backlog'), shop:() => $('#shIn')?.focus()}[page] || (()=>{}))(),
  // Kalender
  prev: () => shift(-1), next: () => shift(1),
  today: () => { cursor = new Date(); tgMem.key = ''; scrollToday = view === 'list'; render(); },
  view: a => { view = a.dataset.v; tgMem.key = ''; render(); },
  filter: a => { const id = a.dataset.id; hidden.has(id) ? hidden.delete(id) : hidden.add(id); render(); },
  day: a => openDayView(a.dataset.date),
  pickDay: a => { if(view === 'week') return openDayView(a.dataset.date); cursor = parseD(a.dataset.date); render(); },
  slot: (a, e) => { if(!can('edit_events')) return; const y = e.clientY - a.getBoundingClientRect().top, m = H0*60 + Math.floor(y / HP * 2) * 30; openNew({date:a.dataset.date, start:toTime(m)}); },
  open: a => openDetail(a.dataset.id),
  new: a => openNew({date:a.dataset.date || (view==='day' ? iso(cursor) : undefined)}),
  quickMore: () => quickCreate(true),
  // Termin-Sheet
  close: () => closeSheet(),
  eType: a => { draft.type = a.dataset.v; if(draft.type === 'abwesenheit'){ draft.allDay = true; draft.participants = []; if(!draft.title) draft.title = 'Urlaub'; } refreshSheet(); },
  eDate: a => { draft.date = a.dataset.v; if(draft.endDate && draft.endDate < draft.date) draft.endDate = ''; refreshSheet(); },
  eDur: a => { draft.end = toTime(toMin(draft.start) + +a.dataset.v); refreshSheet(); },
  ePart: a => { const id = a.dataset.id, i = draft.participants.findIndex(p => p.userId === id); if(i >= 0) draft.participants.splice(i,1); else draft.participants.push({userId:id, status:'pending', comment:''}); refreshSheet(); },
  ePartAll: () => { const others = members().filter(u => u.id !== draft.organizerId), all = others.every(u => draft.participants.some(p => p.userId === u.id)); draft.participants = all ? [] : others.map(u => draft.participants.find(p => p.userId === u.id) || {userId:u.id, status:'pending', comment:''}); refreshSheet(); },
  eNote: () => { draft.showNote = true; refreshSheet(); $('#eDesc')?.focus(); },
  evSave: () => saveEvent(),
  evEdit: a => openEdit(a.dataset.id),
  evDel: a => { const e = db.events.find(x => x.id === a.dataset.id); if(!e) return; closeSheet(); delWithUndo('events', e.id, `„${e.title}“`); },
  accept: a => respond(a.dataset.id, 'accepted'),
  decline: a => respond(a.dataset.id, 'declined'),
  // Anhänge
  attAdd: a => pickFiles(a.dataset.t),
  attRm: a => { if(!draft) return; const i = draft.attachments.findIndex(x => x.id === a.dataset.id); if(i < 0) return; const [x] = draft.attachments.splice(i,1);
    const n = draft.newAtt.findIndex(y => y.id === x.id); if(n >= 0){ draft.newAtt.splice(n,1); removeFiles([x]); } else draft.removedAtt.push(x); refreshSheet(); },
  attOpen: a => { const list = a.dataset.src === 'draft' ? (draft?.attachments || []) : atts(db.events.find(x => x.id === a.dataset.src)); if(list[+a.dataset.i]) openViewer(list, +a.dataset.i); },
  vwPrev: () => stepViewer(-1), vwNext: () => stepViewer(1), vwClose: () => closeViewer(),
  // Wochenplan
  wpPrev: () => { wpCursor = addDays(wpCursor,-7); render(); }, wpNext: () => { wpCursor = addDays(wpCursor,7); render(); }, wpNow: () => { wpCursor = monday(new Date()); render(); },
  tdWho: a => { tdWho = a.dataset.id; const v = $('#tdIn')?.value || ''; render(); const i = $('#tdIn'); if(i){ i.value = v; if(!isMobile()) i.focus(); } },
  tdPrio: a => { const t = db.todos.find(x => x.id === a.dataset.id); if(!t) return; t.prio = t.prio === 'hoch' ? 'normal' : 'hoch'; save(); render(); },
  tdEdit: async a => { const t = db.todos.find(x => x.id === a.dataset.id); if(!t) return; const v = await askText('Ziel umbenennen', '', t.title); if(v && v.trim()){ t.title = v.trim(); save(); render(); } },
  tdDel: a => { const t = db.todos.find(x => x.id === a.dataset.id); if(t) delWithUndo('todos', t.id, `„${t.title}“`); },
  carry: () => { const wk = iso(wpCursor), next = iso(addDays(wpCursor,7)), list = db.todos.filter(t => t.week === wk && !t.done); list.forEach(t => t.week = next); log(`hat ${list.length} offene Ziele in KW ${kw(addDays(wpCursor,7))} übernommen`); save(); wpCursor = addDays(wpCursor,7); render(); toast(`${list.length} Ziele übernommen`); },
  // Projekte
  kAdd: a => openProjNew(a.dataset.s),
  pnStatus: a => { pNew.title = $('#pnTitle')?.value || ''; pNew.status = a.dataset.v; refreshSheet(); },
  pnOwner: a => { pNew.title = $('#pnTitle')?.value || ''; pNew.owner = pNew.owner === a.dataset.u ? '' : a.dataset.u; refreshSheet(); },
  pnSave: () => createProject(),
  projOpen: a => openProj(a.dataset.id),
  pStatus: a => { const p = findP(a.dataset.id); if(!p || p.status === a.dataset.v) return; p.status = a.dataset.v; projChanged(p, `hat „${p.title}“ nach „${KCOLS[p.status].n}“ verschoben`); },
  pOwner: a => { const p = findP(a.dataset.id); if(!p) return; p.owner = p.owner === a.dataset.u ? '' : a.dataset.u; projChanged(p); },
  pNoDl: a => { const p = findP(a.dataset.id); if(!p) return; p.deadline = ''; projChanged(p); },
  sDel: a => { const p = findP(a.dataset.id); if(!p) return; p.subtasks = p.subtasks.filter(s => s.id !== a.dataset.s); projChanged(p); },
  pDel: a => { const p = findP(a.dataset.id); if(!p) return; closeSheet(); delWithUndo('projects', p.id, `Projekt „${p.title}“`); },
  // Einkauf
  shEdit: async a => { const i = db.shopping.find(x => x.id === a.dataset.id); if(!i) return; const v = await dialog('Artikel bearbeiten', [{label:'Artikel', value:i.text}, {label:'Menge (optional)', value:i.qty}], 'Speichern'); if(v && v[0].trim()){ i.text = v[0].trim(); i.qty = v[1].trim(); save(); render(); } },
  shDel: a => { const i = db.shopping.find(x => x.id === a.dataset.id); if(i) delWithUndo('shopping', i.id, `„${i.text}“`); },
  shClear: () => { const removed = db.shopping.filter(i => i.done); db.shopping = db.shopping.filter(i => !i.done); log(`hat ${removed.length} erledigte Artikel entfernt`); save(); render(); toast(`${removed.length} Artikel entfernt`, {label:'Rückgängig', fn:() => { db.shopping.push(...removed); save(); render(); }}); },
  shDoneTog: a => { shOpenDone = !a.parentElement.open; },
  // Team & Profile
  switch: () => showPicker(),
  pinMe: () => setPinFlow(db.currentUser),
  uPin: a => setPinFlow(a.dataset.id),
  uDel: a => delPerson(a.dataset.id),
  uRole: a => updUser(a.dataset.id, 'role', a.dataset.v),
  export: () => exportData(),
  import: () => $('#importFile').click(),
  demoReset: async () => { if(await ask('Alle Demo-Daten zurücksetzen?', 'Zurücksetzen', true)){ db = seed(); save(); showPicker(); toast('Zurückgesetzt'); } },
  teamPw: () => changeTeamPw(),
  teamLogout: async () => { if(await ask('Dieses Gerät vom Team-Zugang abmelden? Danach sind Team-E-Mail und Passwort erneut nötig.', 'Abmelden', true)) await sb.auth.signOut(); },
  // Anmeldung & Profilauswahl
  pick: a => pick(a.dataset.id),
  pinKey: a => pinInput(a.dataset.k),
  pinBack: () => { pinFor = null; pinVal = ''; pinErr = ''; authShow('picker'); },
  bootColor: a => { bootColor = a.dataset.v; $$('.swatch').forEach(s => s.classList.toggle('on', s.dataset.v === bootColor)); },
  retry: () => { authErr = ''; authShow('loading'); startSession(); },
  demo: () => startDemo(),
  leaveDemo: () => { storage.del(STORE+'_mode'); mode = null; db = null; sess = {uid:null, pin:''}; setBanner(''); closeSheet(); authShow('setup'); },
  forgot: () => forgotPw(),
  dlgYes: () => { const ins = $$('#dlg input'); dlgDone(ins.length ? ins.map(i => i.value) : true); },
  dlgNo: () => dlgDone(null)
};
const CHG = {
  eDate: el => { if(!el.value) return; draft.date = el.value; if(draft.endDate && draft.endDate < draft.date) draft.endDate = ''; refreshSheet(); },
  eEnd: el => { draft.endDate = el.value > draft.date ? el.value : ''; refreshSheet(); },
  eAll: el => { draft.allDay = el.checked; refreshSheet(); },
  eStart: el => { if(!el.value) return; const dur = Math.max(15, toMin(draft.end) - toMin(draft.start)); draft.start = el.value; draft.end = toTime(toMin(el.value) + dur); refreshSheet(); },
  eEndT: el => { if(!el.value) return; draft.end = el.value; refreshSheet(); },
  ePriv: el => { draft.private = el.checked; },
  tdToggle: el => { const t = db.todos.find(x => x.id === el.dataset.id); if(!t || !can('todos')) return; t.done = el.checked; if(t.done) log(`hat „${t.title}“ erledigt`); save(); setTimeout(render, 200); },
  pTitle: el => { const p = findP(el.dataset.id); if(!p || !el.value.trim()) return; p.title = el.value.trim(); projChanged(p, '', false); },
  pDeadline: el => { const p = findP(el.dataset.id); if(!p) return; p.deadline = el.value; projChanged(p); },
  pDesc: el => { const p = findP(el.dataset.id); if(!p) return; p.description = el.value; projChanged(p, '', false); },
  pnDl: el => { if(pNew){ pNew.title = $('#pnTitle')?.value || ''; pNew.deadline = el.value; } },
  sDone: el => { const p = findP(el.dataset.id), s = findS(p, el.dataset.s); if(!s) return; s.done = el.checked; projChanged(p, s.done ? `hat „${s.text}“ (${p.title}) erledigt` : ''); },
  sText: el => { const p = findP(el.dataset.id), s = findS(p, el.dataset.s); if(!s || !el.value.trim()) return; s.text = el.value.trim(); projChanged(p, '', false); },
  sWho: el => { const p = findP(el.dataset.id), s = findS(p, el.dataset.s); if(!s) return; s.assignee = el.value; projChanged(p, '', false); },
  shToggle: el => { const i = db.shopping.find(x => x.id === el.dataset.id); if(!i || !can('shopping')) return; i.done = el.checked; i.doneBy = i.done ? db.currentUser : null; save(); setTimeout(render, 200); },
  uColor: el => updUser(el.dataset.id, 'color', el.value),
  uName: el => updUser(el.dataset.id, 'name', el.value)
};
const INP = {
  quick: () => quickPreview(),
  eTitle: el => { draft.title = el.value; },
  eDesc: el => { draft.description = el.value; },
  pnTitle: el => { if(pNew) pNew.title = el.value; }
};
const SUB = {
  quick: () => quickCreate(false),
  todo: () => {
    let v = ($('#tdIn')?.value || '').trim(); if(!v || !can('todos')) return;
    let prio = 'normal'; if(/^!|!$/.test(v)){ prio = 'hoch'; v = v.replace(/^!+\s*|\s*!+$/g,''); }
    db.todos.push({id:newId(), title:v, week:iso(wpCursor), assignee:tdWho||'', prio, done:false});
    log(`hat das Ziel „${v}“ angelegt`); save(); refocus = isMobile() ? null : 'tdIn'; render();
  },
  pNew: () => createProject(),
  sAdd: f => { const p = findP(f.dataset.id), v = ($('#sIn')?.value || '').trim(); if(!p || !v) return; p.subtasks.push({id:newId(), text:v, assignee:'', done:false}); projChanged(p); setTimeout(() => $('#sIn')?.focus(), 30); },
  shop: () => {
    const v = ($('#shIn')?.value || '').trim(); if(!v || !can('shopping')) return;
    const items = v.split(/\s*[,;]\s*/).filter(Boolean).map(parseShop);
    items.forEach(it => db.shopping.push({id:newId(), text:it.text, qty:it.qty, done:false, by:db.currentUser, doneBy:null}));
    log(`hat ${items.map(i => i.text).join(', ')} auf die Einkaufsliste gesetzt`); save(); refocus = 'shIn'; render();
  },
  uAdd: () => addPerson(),
  login: () => doLogin(),
  boot: async () => {
    const name = $('#btName').value.trim(), pin = $('#btPin').value.trim();
    if(!name) return;
    if(pin && !/^\d{4}$/.test(pin)) return toast('Die PIN muss aus genau 4 Ziffern bestehen');
    try{ const id = await api.bootstrap(name, bootColor, pin); await reloadAll(); enter(id, pin); }
    catch(e){ authErr = e.message; renderAuth(); }
  },
  cfg: () => {
    const url = $('#cfgUrl').value.trim().replace(/\/$/,''), key = $('#cfgKey').value.trim();
    if(!/^https:\/\/.+/.test(url) || key.length < 20) return toast('Bitte URL und Key prüfen');
    storage.set(STORE+'_cfg', JSON.stringify({url, key})); storage.del(STORE+'_mode'); location.reload();
  }
};

/* ===================== Ereignisse ===================== */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if(!a || a.disabled) return;
  const fn = ACT[a.dataset.act]; if(!fn) return;
  if(a.tagName === 'SUMMARY'){ fn(a, e); return; }
  e.preventDefault(); fn(a, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if(el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input',  e => { const el = e.target.closest('[data-inp]'); if(el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-sub]'); if(!f) return; e.preventDefault(); SUB[f.dataset.sub]?.(f, e); });
$('#sheetBg').addEventListener('click', e => { if(e.target === e.currentTarget) closeSheet(); });
$('#dlgBg').addEventListener('click', e => { if(e.target === e.currentTarget) dlgDone(null); });

document.addEventListener('keydown', e => {
  const t = e.target, dlgOpen = $('#dlgBg').classList.contains('show');
  if(authScreen === 'pin' && !dlgOpen){
    if(/^\d$/.test(e.key)){ e.preventDefault(); pinInput(e.key); }
    else if(e.key === 'Backspace'){ e.preventDefault(); pinInput('del'); }
    else if(e.key === 'Escape') ACT.pinBack();
    return;
  }
  if(viewerOpen()){
    if(e.key === 'Escape'){ e.preventDefault(); return closeViewer(); }
    if(e.key === 'ArrowLeft') return stepViewer(-1);
    if(e.key === 'ArrowRight') return stepViewer(1);
    return;
  }
  if(e.key === 'Enter' && !e.isComposing && (t.id === 'pnTitle' || t.id === 'sIn')){
    e.preventDefault();
    if(t.id === 'pnTitle') return createProject();
    const f = t.closest('[data-sub="sAdd"]'); if(f) SUB.sAdd(f); return;
  }
  if(e.key === 'Escape'){
    if(dlgOpen) return dlgDone(null);
    if(sheetOpen()) return closeSheet();
    if(t.id === 'quickIn'){ t.value = ''; quickPreview(); t.blur(); }
    return;
  }
  if(dlgOpen && e.key === 'Enter' && t.closest('#dlg') && t.tagName === 'INPUT'){ e.preventDefault(); return ACT.dlgYes(); }
  if(authScreen) return;
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey) && draft && sheetOpen()){ e.preventDefault(); return saveEvent(); }
  if(e.key === 'Enter' && t.id === 'eTitle'){ e.preventDefault(); return saveEvent(); }
  if(e.key === 'Tab' && t.id === 'quickIn' && t.value.trim()){ e.preventDefault(); return quickCreate(true); }
  const typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName) || t.isContentEditable;
  if(typing || e.metaKey || e.ctrlKey || e.altKey || !db || !me() || sheetOpen() || dlgOpen) return;
  const k = e.key.toLowerCase();
  if(k === 'n' && can('edit_events')){ e.preventDefault(); if(page !== 'cal'){ page = 'cal'; render(); } openNew({date:view==='day' ? iso(cursor) : undefined}); }
  else if(e.key === '/' && can('edit_events')){ e.preventDefault(); if(page !== 'cal'){ page = 'cal'; render(); } $('#quickIn')?.focus(); }
  else if(page === 'cal'){
    if(e.key === 'ArrowLeft') shift(-1); else if(e.key === 'ArrowRight') shift(1); else if(k === 't') ACT.today();
    else if({m:'month', w:'week', d:'day', l:'list'}[k]){ view = {m:'month', w:'week', d:'day', l:'list'}[k]; tgMem.key = ''; render(); }
  }
});

// Wischen zum Blättern (Kalender & Bildbetrachter)
let tx = null, ty = null;
document.addEventListener('touchstart', e => { if(e.target.closest('#calBody') || e.target.closest('#viewer')){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = null; }, {passive:true});
document.addEventListener('touchend', e => {
  if(tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6){ if(viewerOpen()) stepViewer(dx < 0 ? 1 : -1); else shift(dx < 0 ? 1 : -1); }
}, {passive:true});

// Drag & Drop im Kanban
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.kcard[draggable=true]'); if(c){ e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); } });
document.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); $$('.kc.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const k = e.target.closest?.('.kc'); if(k && can('projects')){ e.preventDefault(); $$('.kc.over').forEach(x => x !== k && x.classList.remove('over')); k.classList.add('over'); } });
document.addEventListener('drop', e => {
  const k = e.target.closest?.('.kc'); if(!k) return; e.preventDefault();
  const p = findP(e.dataTransfer.getData('text/plain'));
  if(p && p.status !== k.dataset.col){ p.status = k.dataset.col; log(`hat „${p.title}“ nach „${KCOLS[p.status].n}“ verschoben`); save(); }
  render();
});

// Zurück in die App / Netz wieder da
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && mode === 'cloud' && db && sb && authScreen !== 'login' && authScreen !== 'setup') reloadAll(); });
addEventListener('online', () => { if(mode === 'cloud' && db && sb){ if(pendingRetry) save(); reloadAll(); } });
addEventListener('offline', () => { if(mode === 'cloud'){ setSync('err','Offline'); if(sess.uid) setBanner(`${ic('alert',16)} Offline – Änderungen werden später übertragen.`); } });
let lastMobile = isMobile();
addEventListener('resize', () => { if(isMobile() !== lastMobile){ lastMobile = isMobile(); if(db && me()) render(); } });
setInterval(() => { if(db && me() && page === 'cal' && (view === 'day' || view === 'week') && !sheetOpen()) scheduleRender(); }, 60000);

if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
boot();
</script>
